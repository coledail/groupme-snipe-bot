# Render service descriptor (template). Replace placeholders as needed.
services:
  - type: web
    name: groupme-snipe-bot-backend
    env: node
    region: virginia
    plan: free
    branch: main
    repo: .
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run db:init && npm start
    autoDeploy: true
    # For production with persistent storage, attach a disk and set DATABASE_PATH.
    # For free-tier without disk, use a managed Postgres and set DATABASE_URL in Render environment.
    envVars:
      - key: DATABASE_URL
        # Set this to your Postgres connection string (e.g. from Supabase or Neon).
        value: ""
      - key: DATABASE_PATH
        # If you attach a disk and want to use SQLite, set this (e.g. /data/dev.db).
        value: ""

cronJobs:
  - name: db-backup
    schedule: "0 3 * * *" # daily at 03:00 UTC
    command: bash ./scripts/backup_db.sh
    shell: true
